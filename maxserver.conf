server {
    listen 8089;

    server_name localhost;

    client_max_body_size 1000000;

    error_page 404 ./errors/404.html;
    error_page 403 ./errors/403.html;
    error_page 500 ./errors/500.html;

    location / {
        allowed_methods GET POST DELETE;

        root ./www;

        index index.html;

        autoindex off;
    }

    location /images {
        allowed_methods GET;

        root ./assets/images;

        autoindex on;
    }

    location /uploads {
        allowed_methods GET POST DELETE;

        root ./uploads;

        upload_enabled on;

        upload_store ./uploads;

        autoindex on;
    }

    location /old-page {
        allowed_methods GET;

        redirect http://localhost:8089/new-page;
    }

    location /cgi-bin {
        allowed_methods GET POST;

        root ./cgi-bin;

        cgi .py /usr/bin/python3;

        cgi .php /usr/bin/php-cgi;
    }
}
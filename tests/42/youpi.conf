server {
	listen 8888;
	server_name localhost;
	client_max_body_size 100000000;

	location / {
		allowed_methods GET;
		root ./var/www;
		index /index.html;
	}

	location /directory {
		allowed_methods GET POST;
		alias ./tests/42/YoupiBanane;
		index /youpi.bad_extension;
		cgi .bla ./tests/42/cgi_tester;
	}

	location /post_body {
		allowed_methods POST;
		upload_enabled on;
		root ./var/www;
		client_max_body_size 100;
	}
}
